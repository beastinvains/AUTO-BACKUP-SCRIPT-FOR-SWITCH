{% extends 'base.html' %}

{% block content %}
  <h1 class="h3">Settings</h1>
  <p class="text-muted">Saved in <code>config.json</code>. The scheduler reloads these settings.</p>

  <form method="post" class="card card-body col-lg-7">
    <div class="mb-3">
      <label class="form-label">Backup time</label>
      <input class="form-control" type="time" name="backup_time" value="{{ settings.backup_time }}" step="60" required>
      <div class="form-text">
        Use local 24-hour time: <code>02:00</code> is 2:00 AM and <code>14:00</code> is 2:00 PM.
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Backup directory</label>
      <input class="form-control" name="backup_directory" value="{{ settings.backup_directory }}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Worker threads</label>
      <input class="form-control" type="number" name="max_workers" value="{{ settings.max_workers }}" min="1" max="64" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Backup retention (days)</label>
      <input class="form-control" type="number" name="retention_days" value="{{ settings.retention_days }}" min="1" max="3650" required>
    </div>

    <button class="btn btn-primary align-self-start">Save settings</button>
  </form>
{% endblock %}
