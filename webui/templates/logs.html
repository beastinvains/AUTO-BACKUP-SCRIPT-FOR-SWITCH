{% extends 'base.html' %}{% block content %}<h1 class="h3">Logs</h1><form class="row g-2 mb-3"><div class="col-sm-3"><select class="form-select" name="level"><option value="">All levels</option>{% for option in ['INFO', 'WARNING', 'ERROR'] %}<option value="{{ option }}" {{ 'selected' if level == option }}>{{ option }}</option>{% endfor %}</select></div><div class="col-sm-5"><input class="form-control" name="q" value="{{ query }}" placeholder="Search log lines"></div><div class="col-auto"><button class="btn btn-outline-primary">Filter</button></div><div class="col-auto form-check pt-2"><input class="form-check-input" type="checkbox" id="auto-refresh" data-refresh="10000"><label class="form-check-label" for="auto-refresh">Auto refresh</label></div></form><pre class="log-view">{% for line in lines %}{{ line }}
{% else %}No matching log entries found.{% endfor %}</pre>{% endblock %}
