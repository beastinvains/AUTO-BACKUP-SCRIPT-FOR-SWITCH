<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Backup Dashboard{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand navbar-dark bg-dark mb-4"><div class="container"><a class="navbar-brand" href="{{ url_for('ui.dashboard') }}">Network Backups</a><div class="navbar-nav"><a class="nav-link" href="{{ url_for('ui.dashboard') }}">Dashboard</a><a class="nav-link" href="{{ url_for('ui.reports') }}">Reports</a><a class="nav-link" href="{{ url_for('ui.inventory') }}">Devices</a><a class="nav-link" href="{{ url_for('ui.settings') }}">Settings</a><a class="nav-link" href="{{ url_for('ui.logs') }}">Logs</a></div><form class="d-flex" action="{{ url_for('ui.reports') }}"><input class="form-control form-control-sm" name="q" placeholder="Search reports"></form></div></div></nav><main class="container pb-5">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='js/app.js') }}"></script>{% block scripts %}{% endblock %}</body></html>
